<style>

[data-t="4"]{--bg:#eef6fb;--card:#fff;--ink:#10324a;--mut:#547089;--line:#cfe3ef;--acc:#0e7fc0;--navy:#0b3a5c;--fh:system-ui,"Noto Sans KR",sans-serif;--r:16px}
[data-t="5"]{--bg:#edf9f3;--card:#fff;--ink:#0f3d36;--mut:#4f7a72;--line:#cdeade;--acc:#f0605d;--navy:#0f766e;--fh:system-ui,"Noto Sans KR",sans-serif;--r:20px}
[data-t="6"]{--bg:#0f0b1e;--card:#1a1433;--ink:#f3eefe;--mut:#a79bc9;--line:#31285a;--acc:#ff4fa3;--navy:#08051a;--onacc:#fff;--warn:#fb7185;--fh:system-ui,"Noto Sans KR",sans-serif;--r:12px;color-scheme:dark}
[data-t="7"]{--bg:#f6f6f4;--card:#fff;--ink:#1c1c1c;--mut:#777;--line:#e5e5e0;--acc:#111;--navy:#1c1c1c;--fh:system-ui,"Noto Sans KR",sans-serif;--r:4px}
[data-t="8"]{--bg:#f6ecdd;--card:#fffaf1;--ink:#43281a;--mut:#8a6a50;--line:#e4d2b6;--acc:#c2562a;--navy:#7a3b1e;--r:12px}
[data-t="9"]{--bg:#fbf8f0;--card:#fff;--ink:#1b2a4a;--mut:#6b7490;--line:#e3dfd0;--acc:#d63a3a;--navy:#1b3a8a;--r:8px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 12px}
.bar b{letter-spacing:.14em;font-size:13px;flex:1}.bar .sub{color:#b9c2cf;font-size:12px}
.bar button{background:transparent;color:#fff;border-color:#ffffff44;font-size:12px;padding:5px 9px}.bar .pri,.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.side{display:none}.side h4{margin:16px 0 4px;font:11px ui-monospace,monospace;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.side a{display:block;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}.side a:hover{background:var(--bg)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;overflow-x:auto;background:var(--navy);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav a{flex:none;color:#d3dae4;text-decoration:none;font-size:12px;padding:6px 10px;white-space:nowrap}
main{padding-bottom:64px}section{max-width:860px;margin:0 auto;padding:26px 16px}
.cover{max-width:none;position:relative;background:linear-gradient(160deg,var(--navy),color-mix(in srgb,var(--navy),#fff 16%)) center/cover;padding:40px 16px 46px}
.cover.img::before{content:"";position:absolute;inset:0;background:rgba(8,12,18,.5)}.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(135deg,var(--acc) 0 14px,#fff 14px 28px,var(--navy) 28px 42px,#fff 42px 56px)}
.bp{position:relative;z-index:1;display:flex;max-width:780px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:var(--r);box-shadow:0 14px 40px #0005;overflow:visible}
.bp-m{flex:1;padding:22px 24px}.bp-m h1{font:700 clamp(26px,5vw,40px)/1.2 var(--fh);margin:6px 0}.bp-m p{margin:2px 0;color:var(--mut)}
.bp-s{position:relative;width:190px;padding:18px;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700}
.bp-s span{display:block;font:10px ui-monospace,monospace;letter-spacing:.14em;color:var(--mut)}
.bp-s::before,.bp-s::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--navy)}.bp-s::before{top:-10px}.bp-s::after{bottom:-10px}
.barcode{height:34px;margin-top:auto;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px)}
.route{display:flex;align-items:center;gap:10px;font:700 20px var(--fh);margin-top:12px}.route i{flex:1;position:relative;border-top:2px dashed var(--line);height:0}.route i::after{content:"✈";position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:var(--card);padding:0 6px;color:var(--acc);font-size:16px}
@media(max-width:640px){.bp{flex-direction:column}.bp-s{width:auto;border-left:0;border-top:2px dashed var(--line);flex-direction:row;flex-wrap:wrap;gap:14px}.bp-s::before{left:-10px;top:-11px}.bp-s::after{left:auto;right:-10px;top:-11px;bottom:auto}.barcode{flex:1;min-width:90px;margin:0}}
.en{color:var(--acc);font:11px ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase}
.sh{display:flex;gap:12px;align-items:center;margin-bottom:16px}.ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--navy);display:grid;place-items:center;font-size:22px}
h2{font:700 24px var(--fh);margin:0}h3{margin:18px 0 8px;font-size:16px}
.mut,.sub{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}.grid .card{margin:0}
.stat{text-align:center}.stat b{display:block;font:700 18px var(--fh)}
.ci{position:relative;padding-left:52px}.ci::before{content:attr(data-e);position:absolute;left:12px;top:12px;font-size:24px}
.tk{border-left:4px dashed var(--acc)}.bpc{border-left:6px solid var(--acc)}
.kv{display:flex;gap:10px;font-size:14px}.kv span{color:var(--mut);flex:none;width:64px}
.note{color:var(--mut);white-space:pre-wrap;font-size:14px}a{color:var(--acc)}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.dn{background:var(--navy);color:#fff;border-radius:10px;padding:8px 10px;font:700 14px ui-monospace,monospace}
.tl{border-left:2px dashed var(--line);padding:2px 0 14px 16px;margin-left:8px;position:relative}
.tl::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}.tm{color:var(--acc);font:700 14px ui-monospace,monospace;margin-right:6px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.dng{color:var(--warn)}.add{width:100%;border-style:dashed;margin:4px 0 10px}.acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:3px 0}
select{width:auto}textarea{min-height:70px}.row{display:flex;gap:6px;align-items:center}input[type=color]{height:38px;padding:2px}
input[type=checkbox]{width:auto;margin:5px 0 0}label.ck{display:flex;gap:10px;padding:5px 0}.done span{text-decoration:line-through;color:var(--mut)}
.dimg{height:150px;border-radius:var(--r);background:var(--line) center/cover;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chip{flex:none;border-radius:999px;font-size:13px;padding:5px 12px}.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
#map{position:relative;z-index:0;height:380px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:8px}
.mk{width:24px;height:24px;border-radius:50%;color:#fff;font:700 12px/20px system-ui;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.hd{cursor:grab;font-size:20px;padding:0 6px;user-select:none}.dz{border:2px dashed var(--line);border-radius:var(--r);padding:10px;text-align:center;color:var(--mut);font-size:13px;margin-bottom:8px}.over{outline:2px solid var(--acc)}.dragging{opacity:.4}
.sbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:8;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px}.sbox a{display:block;padding:6px 4px;font-size:14px;text-decoration:none}
.load{text-align:center;padding:90px 16px;color:var(--mut)}
.mask{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}.dlg{width:100%;max-width:380px;margin:0}
@media(min-width:960px){.side{display:block;position:fixed;top:46px;left:0;bottom:0;width:232px;overflow:auto;padding:12px 14px;background:var(--card);border-right:1px solid var(--line)}main{padding:0 0 30px 232px}.bnav{display:none}}
</style></head>
<body><div id="app"></div>
<script>
const API='https://planbook-admin.sukzzang0907.workers.dev/',$=id=>document.getElementById(id);
const DEF=['overview','map','glance','flights','hotels','days','tickets','transport','shop','prep','tips'];
const IC={overview:'🧭',map:'🗺️',glance:'🗓️',flights:'✈️',hotels:'🏨',days:'📅',tickets:'🎫',transport:'🚇',shop:'🛍️',prep:'🧳',tips:'💡'};
const LB={overview:'여행 개요',map:'통합 지도',glance:'추천 일정',flights:'항공편',hotels:'숙소',days:'Day 상세',tickets:'e-티켓',transport:'대중교통',shop:'쇼핑&기념품',prep:'준비물',tips:'팁'};
const EN={overview:'overview',map:'map',glance:'schedule',flights:'flights',hotels:'accommodation',tickets:'tickets',transport:'transportation',shop:'shopping',prep:'checklist',tips:'local tips'};
const TP=['✈️ 보딩패스','🛫 공항 전광판','🧳 빈티지 캐리어','🗼 파리 감성','🌊 지중해','🌴 트로피컬','🌃 도쿄 네온','⛰️ 북유럽','🏜️ 사파리','📮 에어메일'];
const PAL=['#e4572e','#17bebb','#e0a800','#76b041','#8e6bbf','#f28482','#3a86ff','#fb8500'];
const SC={hotels:'name:숙소명,city:도시,ci:체크인,co:체크아웃,addr:주소',flights:'no:구분,date:날짜,route:구간 (예: ICN → CDG),time:시간',tickets:'title:이름,date:일시,note:메모,url:티켓 링크',shop:'name:이름,city:도시,type:분류,addr:주소',transport:'city:도시,text:이동 안내',items:'time:시간,title:제목,place:장소 (지도 검색어),note:메모',foods:'name:이름,cat:분류,rate:평점,note:소개'};
const FLS='🇰🇷 서울 부산 제주 한국;🇯🇵 도쿄 오사카 교토 후쿠오카 삿포로 오키나와 나고야 일본;🇹🇭 방콕 치앙마이 푸켓 파타야 태국;🇻🇳 하노이 다낭 호치민 푸꾸옥 나트랑 달랏 베트남;🇸🇬 싱가포르;🇲🇾 쿠알라룸푸르 코타키나발루 말레이시아;🇵🇭 세부 마닐라 보라카이 필리핀;🇮🇩 발리 자카르타 인도네시아;🇭🇰 홍콩;🇲🇴 마카오;🇹🇼 타이베이 타이페이 대만;🇨🇳 상하이 베이징 중국;🇫🇷 파리 니스 리옹 마르세유 스트라스부르 프랑스;🇪🇸 바르셀로나 마드리드 세비야 그라나다 발렌시아 스페인;🇮🇹 로마 밀라노 베네치아 피렌체 나폴리 이탈리아;🇬🇧 런던 에딘버러 영국;🇮🇪 더블린;🇳🇱 암스테르담 네덜란드;🇧🇪 브뤼셀 벨기에;🇩🇪 베를린 뮌헨 프랑크푸르트 독일;🇨🇭 취리히 인터라켄 루체른 제네바 스위스;🇦🇹 빈 잘츠부르크 할슈타트 오스트리아;🇨🇿 프라하 체코;🇭🇺 부다페스트 헝가리;🇵🇱 바르샤바 크라쿠프 폴란드;🇵🇹 리스본 포르투 포르투갈;🇬🇷 아테네 산토리니 그리스;🇹🇷 이스탄불 튀르키예 터키;🇦🇪 두바이 아부다비;🇩🇰 코펜하겐;🇸🇪 스톡홀름;🇳🇴 오슬로;🇫🇮 헬싱키;🇮🇸 레이캬비크 아이슬란드;🇭🇷 두브로브니크 자그레브 크로아티아;🇺🇸 뉴욕 로스앤젤레스 LA 샌프란시스코 라스베이거스 하와이 호놀룰루 시애틀 미국;🇨🇦 밴쿠버 토론토 캐나다;🇦🇺 시드니 멜버른 호주;🇳🇿 오클랜드 퀸스타운 뉴질랜드;🇬🇺 괌;🇲🇵 사이판;🇪🇬 카이로 이집트;🇲🇦 마라케시 모로코;🇿🇦 케이프타운;🇲🇽 멕시코시티 칸쿤 멕시코;🇧🇷 리우 브라질;🇲🇻 몰디브;🇮🇳 델리 인도;🇳🇵 카트만두 네팔;🇲🇳 울란바토르 몽골;🇷🇺 모스크바 블라디보스토크 러시아';
const FM={};FLS.split(';').forEach(g=>{const [f,...k]=g.split(' ');k.forEach(x=>FM[x]=f)});
const fl=(c,d)=>{if(d&&d.flag)return d.flag;c=c||'';for(const k in FM)if(c.includes(k))return FM[k];return '📍'};
const blank=()=>({title:'',sub:'',kicker:'',code:'',start:'',airline:'',overview:'',tpl:0,cover:'',days:[],hotels:[],flights:[],tickets:[],shop:[],transport:[],check:[],tips:'',order:DEF.slice(),hide:[]});
const norm=o=>{const d=blank();for(const k in d)if(o[k]==null)o[k]=d[k];
  o.days.forEach(x=>{x.foods||=[];x.items||=[];x.img||=''});
  const od=Array.isArray(o.order)?o.order.filter(k=>DEF.includes(k)):[];
  if(od.length&&!od.includes('map'))od.splice(od.indexOf('overview')+1,0,'map');
  o.order=[...od,...DEF.filter(k=>!od.includes(k))];o.hide=Array.isArray(o.hide)?o.hide:[];
  o.tpl=Number.isInteger(+o.tpl)&&+o.tpl>=0&&+o.tpl<10?+o.tpl:0;
  o.hotels.forEach(h=>{delete h.conf});o.check.forEach(c=>{c.g||='필수'});delete o.acc;delete o.navy;delete o.people;return o};
let S=blank(),ui={edit:false,msg:'',sync:'',dlg:null,loading:true,mapDay:-1,sq:false};
let G=null,sha=null,last=JSON.stringify(S),DR=null,M=null;
const note=t=>{ui.sync=t;const e=$('sy');if(e)e.textContent=t};
const call=async(op,data)=>{
  if(!API)throw new Error('관리 서버 주소(API)가 아직 설정되지 않았습니다');
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,pw:G.pw,data})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error==='pw'?'비밀번호가 올바르지 않습니다':'서버 오류 ('+(j.error||r.status)+')');
  return j;
};
async function loadLatest(){const j=await call('get');if(j.data&&Array.isArray(j.data.days)){S=norm(j.data)}last=JSON.stringify(S)}
async function commit(){
  note('GitHub 저장 중…');const snap=JSON.stringify(S);
  try{await call('put',S);last=snap;note('커밋됨 · 사이트 반영까지 최대 10분')}catch(e){note('저장 실패: '+e.message)}
}
const save=()=>{if(G&&ui.edit&&JSON.stringify(S)!==last)note('저장 안 됨 · 완료를 누르면 GitHub에 저장됩니다')};
async function finish(){
  if(G&&JSON.stringify(S)!==last)await commit();
  if(!G||JSON.stringify(S)===last)ui.edit=false;
  render();
}
addEventListener('beforeunload',e=>{if(G&&ui.edit&&JSON.stringify(S)!==last){e.preventDefault();e.returnValue=''}});
async function unlock(){
  G={pw:$('pw').value};
  try{await loadLatest();ui.dlg=null;ui.edit=true;ui.msg='';render()}
  catch(e){G=null;ui.msg=e.message;render()}
}
const dlg=()=>!ui.dlg?'':`<div class="mask"><div class="card dlg"><b>관리자 비밀번호</b><input id="pw" type="password" placeholder="비밀번호" autocomplete="off"><div class="acts"><button class="pri" data-a="unlock">확인</button><button data-a="cancel">취소</button></div><p class="sub">${esc(ui.msg)}</p></div></div>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapQ=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const set=(p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v};
const W='일월화수목금토',p2=n=>String(n).padStart(2,'0');
const dt=i=>{const d=new Date((S.start||new Date().toISOString().slice(0,10))+'T00:00');d.setDate(d.getDate()+i);return d};
const fy=d=>`${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} (${W[d.getDay()]})`;
const fs=d=>`${p2(d.getMonth()+1)}/${p2(d.getDate())}`;
const dtx=i=>S.start?fy(dt(i)):'';
const today=()=>new Date(new Date().toDateString());
const dd=()=>{if(!S.start||!S.days.length)return '';const n=Math.round((dt(0)-today())/864e5);return n>0?'D-'+n:n>-S.days.length?'여행 '+(1-n)+'일차':'여행 완료'};
const isU=u=>/^https?:\/\//.test(u||'');

async function initMap(){
  const el=$('map');if(!el)return;
  try{await lf()}catch(e){el.innerHTML='<p class="sub" style="padding:16px">지도를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</p>';return}
  if(!$('map'))return;
  try{M&&M.remove()}catch(e){}
  M=L.map(el,{scrollWheelZoom:false}).setView([25,10],2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(M);
  const pts=[];
  S.days.forEach((d,i)=>{if(ui.mapDay>=0&&ui.mapDay!==i)return;const c=PAL[i%8],ln=[];
    d.items.forEach((t,j)=>{if(t.lat==null)return;const ll=[t.lat,t.lng];ln.push(ll);pts.push(ll);
      L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="mk" style="background:${c}">${j+1}</div>`,iconSize:[24,24]})}).addTo(M).bindPopup(`<b>D${i+1} · ${esc(t.title)}</b><br>${esc(t.time)} ${esc(t.place)}<br><a href="#d${i+1}">Day ${i+1} 일정 보기</a>`)});
    if(ln.length>1)L.polyline(ln,{color:c,weight:3,opacity:.7,dashArray:'6 6'}).addTo(M)});
  if(pts.length)M.fitBounds(pts,{padding:[30,30],maxZoom:15});
}
async function geo(){
  const todo=[];S.days.forEach(d=>d.items.forEach(t=>{if(t.place&&t.lat==null&&!t.nf)todo.push(t)}));
  if(!todo.length){note('새로 불러올 장소가 없습니다');return}
  for(let n=0;n<todo.length;n++){
    note(`위치 확인 중 ${n+1}/${todo.length}`);const t=todo[n];
    try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(t.place));const j=await r.json();if(j[0]){t.lat=+(+j[0].lat).toFixed(5);t.lng=+(+j[0].lon).toFixed(5)}else t.nf=1}catch(e){note('위치 확인 실패 (네트워크)');break}
    await new Promise(r=>setTimeout(r,1100));
  }
  note('위치 확인 완료 · 완료를 눌러 저장하세요');render();
}
function showQ(v){v=v.trim().toLowerCase();const R=[];
  if(v){S.days.forEach((d,i)=>{if(d.city.toLowerCase().includes(v))R.push(['#d'+(i+1),`Day ${i+1} · ${d.city}`]);
    d.items.forEach(t=>{if((t.title+t.place+t.note).toLowerCase().includes(v))R.push(['#d'+(i+1),`Day ${i+1} · ${t.time} ${t.title}`])});
    d.foods.forEach(f=>{if((f.name+f.cat+f.note).toLowerCase().includes(v))R.push(['#d'+(i+1),`Day ${i+1} · 🍽 ${f.name}`])})});
    [['hotels','name','🏨'],['tickets','title','🎫'],['shop','name','🛍']].forEach(([k,f,ic])=>S[k].forEach(o=>{if(JSON.stringify(o).toLowerCase().includes(v))R.push(['#'+k,`${ic} ${o[f]}`])}))}
  $('qr').innerHTML=v?(R.slice(0,20).map(([h,t])=>`<a href="${h}">${esc(t)}</a>`).join('')||'<p class="sub">검색 결과가 없습니다</p>'):'';

  else if(a==='addday')S.days.push({city:S.days.at(-1)?.city||'',items:[],foods:[],img:''});
  else if(a==='delday')S.days.splice(i,1);
  else if(a==='mvday'){const j=i+s;if(j>=0&&j<S.days.length)[S.days[i],S.days[j]]=[S.days[j],S.days[i]]}
  else if(a==='add')get(k).push(Object.fromEntries(SC[b.dataset.t].split(',').map(x=>[x.split(':')[0],''])));

  else if(a==='mv'){const R=get(k),j=i+s;if(j>=0&&j<R.length)[R[i],R[j]]=[R[j],R[i]]}
  else if(a==='chk')S.check[i].done=b.checked;
  else if(a==='copy'){const t=$('bk');t.select();try{navigator.clipboard.writeText(t.value);ui.msg='복사했습니다.'}catch(x){ui.msg='직접 선택해서 복사하세요.'}}
  else if(a==='load'){try{const o=JSON.parse($('bk').value);if(!Array.isArray(o.days))throw 0;S=norm(o);ui.msg='불러왔습니다.'}catch(x){ui.msg='형식이 올바르지 않아 불러오지 못했습니다.'}}
  else if(a==='reset'){S=blank();ui.msg='빈 플랜으로 초기화했습니다. 완료를 누르면 저장됩니다.'}
  if(sv)save();if(ren)render();
});
document.addEventListener('change',e=>{
  const t=e.target,mv=t.dataset.mv;
  if(mv){if(t.value==='')return;const [d,i]=mv.split('.').map(Number),n=+t.value;moveItem(d,i,n,S.days[n].items.length);save();render();return}
  const p=t.dataset.p;if(!p)return;
  set(p,t.value);
  if(/\.place$/.test(p)){const q=p.split('.');q.pop();const o=get(q.join('.'));delete o.lat;delete o.lng;delete o.nf}
  save();
  if(/^(title|sub|kicker|code|start|airline|overview|cover)$|city|flag|\.g$|\.img$|\.place$/.test(p))render();
});
document.addEventListener('input',e=>{if(e.target.id==='q')showQ(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')unlock()});
document.addEventListener('dragstart',e=>{const h=e.target.closest&&e.target.closest('[data-dr]');if(!h)return;DR=h.dataset.dr.split('.').map(Number);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','x');const c=h.closest('.card');if(c){e.dataTransfer.setDragImage(c,10,10);c.classList.add('dragging')}});
document.addEventListener('dragover',e=>{const t=e.target.closest&&e.target.closest('[data-dt]');if(DR&&t){e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));t.classList.add('over')}});
document.addEventListener('dragend',()=>{DR=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('drop',e=>{const t=e.target.closest&&e.target.closest('[data-dt]');if(!DR||!t)return;e.preventDefault();const [d2,i2]=t.dataset.dt.split('.').map(Number);moveItem(DR[0],DR[1],d2,i2);DR=null;save();render()});
render(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(o=>{if(o&&Array.isArray(o.days)&&!ui.edit){S=norm(o);last=JSON.stringify(S)}}).catch(()=>{}).finally(()=>{ui.loading=false;render(false)});
</script></body></html>
